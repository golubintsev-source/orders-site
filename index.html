<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявки</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <div class="user-row">
          <p id="userInfo"></p>

          <button id="logoutBtn" class="logout-icon-btn" type="button" title="Выйти">
            <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <nav class="section-nav" role="navigation">
      <button type="button" class="section-nav-btn active" data-section="new">Новый</button>
      <button type="button" class="section-nav-btn" data-section="all">Все</button>
      <button type="button" class="section-nav-btn" data-section="inprogress">В работе</button>
    </nav>

    <section id="section-new" class="content-section active">
      <div class="card">

      <form id="orderForm">
        <div class="grid">
          <div class="field">
            <label>Дата заказа</label>
            <input type="date" id="order_date" />
          </div>

          <div class="field">
            <label>Номер</label>
            <input type="text" id="order_number" />
          </div>

          <div class="field">
            <label>Клиент</label>
            <input type="text" id="client" />
          </div>

          <div class="field">
            <label>Телефон</label>
            <input type="text" id="phone" />
          </div>

          <div class="field full">
            <label>Описание</label>
            <textarea id="description"></textarea>
          </div>

          <div class="field">
            <label>Статус оплаты</label>
            <select id="payment_status">
              <option value="нет" selected>нет</option>
              <option value="оплачен">оплачен</option>
            </select>
          </div>

          <div class="field">
            <label>Сумма</label>
            <input type="number" step="0.01" id="amount" />
          </div>

          <div class="field">
            <label>Предоплата</label>
            <input type="number" step="0.01" id="prepayment" />
          </div>

          <div class="field">
            <label>Кому предоплата</label>
            <input type="text" id="prepayment_to" />
          </div>

          <div class="field">
            <label>Остаток</label>
            <input type="number" step="0.01" id="remaining_amount" />
          </div>

          <div class="field">
            <label>Кому остаток</label>
            <input type="text" id="remaining_to" />
          </div>

          <div class="field">
            <label>Площадь м²</label>
            <input type="number" step="0.01" id="area_m2" />
          </div>

          <div class="field">
            <label>Доставка</label>
            <input type="text" id="delivery" placeholder="да / нет / комментарий" />
          </div>

          <div class="field">
            <label>Дата доставки</label>
            <input type="date" id="delivery_date" />
          </div>

          <div class="field full file-upload-group">
            <label for="attachments">Фото / документы</label>

            <div class="file-upload-box">
              <input
                type="file"
                id="attachments"
                multiple
                accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
                hidden
              />

              <div class="upload-area">
                <button type="button" id="selectFilesBtn" class="upload-btn">
                  📎 Выбрать файлы
                </button>

                <div id="fileUploadText" class="file-upload-text">
                  Файлы не выбраны
                </div>
              </div>

              <div id="selectedFiles" class="selected-files"></div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn">Сохранить заявку</button>
          <button type="button" id="cancelEditBtn" style="display: none;">Отмена</button>
          <button type="button" id="loadBtn">Обновить таблицу</button>
        </div>
      </form>

      <p id="message"></p>
    </div>
    </section>

    <section id="section-all" class="content-section">
      <div class="card">
      <div class="search-box">
        <input
          type="text"
          id="clientSearch"
          placeholder="Поиск по клиенту"
        />
      </div>

      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Дата</th>
              <th>Номер</th>
              <th>Клиент</th>
              <th>Телефон</th>
              <th>Статус</th>
              <th>Сумма</th>
              <th>Предоплата</th>
              <th>Остаток</th>
              <th>Доставка</th>
              <th>Дата доставки</th>
              <th>Файлы</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    </section>

    <section id="section-inprogress" class="content-section">
      <div class="card">
        <p class="section-placeholder">Раздел «В работе». Здесь можно показывать заявки в работе.</p>
        <div class="inprogress-picture">
          <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=600&q=80" alt="Цветок" />
        </div>
      </div>
    </section>
  </div>

  <div id="filesModal" class="files-modal" style="display:none;">
    <div class="files-modal-content">
      <div class="files-modal-header">
        <h3 id="filesModalTitle">Файлы заказа</h3>
        <button type="button" id="closeFilesModal">✖</button>
      </div>

      <div id="filesModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
