<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявки</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <div class="user-row">
          <p id="userInfo"></p>
          <a href="window-calculations.html" class="topbar-link topbar-link-icon" title="Расчет окон">
            <img src="./img/window-calculations-link.svg" alt="Расчет окон" width="28" height="28" decoding="async" />
          </a>
          <button id="logoutBtn" class="logout-icon-btn" type="button" title="Выйти">
            <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <nav class="section-nav" role="navigation">
      <button type="button" class="section-nav-btn active" data-section="all">Заказы</button>
      <button type="button" class="section-nav-btn" data-section="new">Новый</button>
      <button type="button" class="section-nav-btn" data-section="calculations">Расчеты</button>
      <button type="button" class="section-nav-btn" data-section="balance">Баланс</button>
      <button type="button" class="section-nav-btn" data-section="settings">Настройки</button>
    </nav>

    <section id="section-new" class="content-section">
      <div class="card">

      <form id="orderForm">
        <div class="actions actions-top">
          <button type="submit" id="submitBtnTop">Сохранить заказ</button>
          <button type="button" id="cancelEditBtnTop" style="display: none;">Отмена</button>
        </div>
        <p id="messageTop"></p>
        <div class="grid">
          <div class="field">
            <label>Телефон</label>
            <input type="text" id="phone" />
          </div>

          <div class="client-row">
            <div class="field client-field">
              <label>Клиент</label>
              <input type="text" id="client" />
            </div>
            <div class="field">
              <label>Тип заказа</label>
              <select id="order_type">
                <option value="" selected>—</option>
                <option value="Окна">Окна</option>
                <option value="Подоконники">Подоконники</option>
                <option value="Аллюминий">Аллюминий</option>
                <option value="Магазин">Магазин</option>
                <option value="Сетки/мелочь">Сетки/мелочь</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>Адрес</label>
            <input type="text" id="address" />
          </div>

          <div class="field full">
            <label for="description">Описание</label>
            <input type="text" id="description" />
          </div>

          <div class="field">
            <label>Статус</label>
            <select id="payment_status">
              <option value="" selected></option>
              <option value="Контакт с клиентом">Контакт с клиентом</option>
              <option value="Замер назначен">Замер назначен</option>
              <option value="Замер проведен">Замер проведен</option>
              <option value="Расчет сформирован">Расчет сформирован</option>
              <option value="Предложение направлено">Предложение направлено</option>
              <option value="Клиент согласен">Клиент согласен</option>
              <option value="Производство">Производство</option>
              <option value="Товар передан заказчику">Товар передан заказчику</option>
              <option value="Монтаж выполнен">Монтаж выполнен</option>
              <option value="Заказ закрыт">Заказ закрыт</option>
            </select>
          </div>

          <div class="field field-order-date-hidden">
            <label>Дата заказа</label>
            <input type="datetime-local" id="order_date" />
          </div>

          <div class="field compact-fields-row">
            <div class="field">
              <label>Стоимость</label>
              <input type="text" inputmode="decimal" id="amount" />
            </div>
            <div class="field">
              <label>Оплачено</label>
              <select id="paid" disabled>
                <option value="нет">нет</option>
                <option value="да">да</option>
              </select>
            </div>
          </div>

          <div class="field compact-fields-row">
            <div class="field">
              <label>Предоплата</label>
              <input type="text" inputmode="decimal" id="prepayment" />
            </div>
            <div class="field">
              <label>Кому предоплата</label>
              <select id="prepayment_to">
                <option value="">—</option>
                <option value="Дима">Дима</option>
                <option value="Вова">Вова</option>
                <option value="Безнал">Безнал</option>
                <option value="Касса">Касса</option>
              </select>
            </div>
          </div>

          <div class="field compact-fields-row">
            <div class="field">
              <label>Остаток</label>
              <input type="text" inputmode="decimal" id="remaining_amount" />
            </div>
            <div class="field">
              <label>Кому остаток</label>
              <select id="remaining_to">
                <option value="">—</option>
                <option value="Дима">Дима</option>
                <option value="Вова">Вова</option>
                <option value="Безнал">Безнал</option>
                <option value="Касса">Касса</option>
              </select>
            </div>
          </div>

          <div class="field compact-fields-row">
            <div class="field">
              <label>Площадь м²</label>
              <input type="text" inputmode="decimal" id="area_m2" />
            </div>
            <div class="field">
              <label>Москитки</label>
              <input type="text" inputmode="numeric" id="mosquito_nets" />
            </div>
            <div class="field">
              <label>Конструкций</label>
              <input type="text" inputmode="numeric" id="construction_count" />
            </div>
          </div>

          <div class="field compact-fields-row">
            <div class="field">
              <label>Отправка</label>
              <select id="delivery">
                <option value="">—</option>
                <option value="Доставка">Доставка</option>
                <option value="Самовывоз">Самовывоз</option>
              </select>
            </div>
            <div class="field">
              <label>Дата отправки</label>
              <input type="date" id="delivery_date" />
            </div>
          </div>

          <div class="field installation-row">
            <div class="installation-checkbox-wrap">
              <label class="label-checkbox">
                <input type="checkbox" id="installation" />
                Монтаж
              </label>
            </div>
            <div class="installation-date-inline" id="installationDateWrap" style="display: none;">
              <label for="installation_date">Дата</label>
              <input type="date" id="installation_date" />
            </div>
          </div>

          <div class="field compact-fields-row installer-payment-one-row" id="installer_payment_block">
            <div class="field">
              <label for="installer_rate_per_m2">Монтаж 1м², руб</label>
              <input type="text" inputmode="decimal" id="installer_rate_per_m2" />
            </div>
            <div class="field installer-calc-wrap">
              <label>&nbsp;</label>
              <button type="button" id="installer_calc_btn" class="installer-calc-btn" title="Рассчитать сумму (Площадь × Монтаж 1м²)">
                <svg class="installer-calc-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h8M8 14h4M14 14h2M8 18h2M12 18h2M16 18h2"/></svg>
              </button>
            </div>
            <div class="field">
              <label for="installer_payment_amount">з/п за монтаж</label>
              <input type="text" inputmode="decimal" id="installer_payment_amount" />
            </div>
            <div class="field">
              <label for="installer_payment_by">Оплатил</label>
              <select id="installer_payment_by">
                <option value="">—</option>
                <option value="Дима">Дима</option>
                <option value="Вова">Вова</option>
                <option value="Касса">Касса</option>
              </select>
            </div>
          </div>

          <div class="field installation-row">
            <div class="installation-checkbox-wrap">
              <label class="label-checkbox">
                <input type="checkbox" id="reveals" />
                Откосы
              </label>
            </div>
            <div class="installation-date-inline" id="revealsDateWrap" style="display: none;">
              <label for="reveals_date">Дата</label>
              <input type="date" id="reveals_date" />
            </div>
          </div>

          <div class="field full file-upload-group">
            <label for="attachments">Фото и документы</label>

            <div class="file-upload-box">
              <input
                type="file"
                id="attachments"
                multiple
                accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
                hidden
              />

              <div class="upload-area">
                <button type="button" id="selectFilesBtn" class="upload-btn">
                  <svg class="upload-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  Выбрать файлы
                </button>
                <span id="fileUploadText" class="file-upload-text">Файлы не выбраны</span>
              </div>

              <div id="selectedFiles" class="selected-files"></div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn">Сохранить заказ</button>
          <button type="button" id="cancelEditBtn" style="display: none;">Отмена</button>
        </div>
      </form>

      <p id="message"></p>
    </div>
    </section>

    <section id="section-all" class="content-section active">
      <div class="card">
      <div class="search-box">
        <input
          type="text"
          id="clientSearch"
          placeholder="Поиск по Телефон, Клиент, Адрес, Номер, Описание"
        />
      </div>

      <div id="cellTooltip" class="cell-tooltip" aria-hidden="true"></div>
      <div id="statusFilterDropdown" class="status-filter-dropdown" role="dialog" aria-label="Фильтр по статусу" style="display: none;">
        <div class="status-filter-dropdown-inner" id="statusFilterCheckboxes"></div>
      </div>
      <div id="ordersTableScrollTop" class="orders-table-scroll-top" aria-hidden="true">
        <div id="ordersTableScrollSpacer" class="orders-table-scroll-spacer"></div>
      </div>
      <div id="ordersTableScrollBottom" class="table-wrap orders-table-scroll">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>Номер</th>
              <th class="th-order-date">Дата</th>
              <th></th>
              <th class="th-truncate-name">Клиент</th>
              <th class="th-truncate-address">Адрес</th>
              <th class="th-truncate-description">Описание</th>
              <th class="th-status-header">
                <span class="th-status-label">Статус</span>
                <button type="button" class="status-filter-btn" id="statusFilterBtn" title="Фильтр по статусу" aria-haspopup="true" aria-expanded="false">
                  <svg class="status-filter-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                </button>
              </th>
              <th class="th-money">Стоимость</th>
              <th class="th-money">Предоплата</th>
              <th>Кому</th>
              <th class="th-money">Остаток</th>
              <th class="th-paid">Оплачено</th>
              <th>Кому</th>
              <th>Отправка</th>
              <th class="th-delivery-date">Дата</th>
              <th class="th-installation-date">Монтаж</th>
              <th class="th-area-m2">м2</th>
              <th class="th-money th-money-header-right">з/п</th>
              <th>Оплатил</th>
              <th>Откосы</th>
              <th>Москитки</th>
              <th>Конструкций</th>
              <th></th>
              <th class="th-phone">Телефон</th>
              <th></th>
              <th></th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    </section>

    <section id="section-calculations" class="content-section">
      <div class="card">
        <form id="calculationsForm" class="calculations-form" aria-label="Добавить запись в расчеты">
          <div class="calculations-form-column">
            <div class="field">
              <label for="calcFrom">Откуда</label>
              <select id="calcFrom">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcTo">Куда</label>
              <select id="calcTo">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Зарплата">Зарплата</option>
                <option value="Покупка">Покупка</option>
                <option value="Списание">Списание</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcAmount">Сумма</label>
              <input type="text" id="calcAmount" inputmode="decimal" />
            </div>
            <div class="field">
              <label for="calcComment">Комментарий</label>
              <input type="text" id="calcComment" />
            </div>
            <button type="submit" id="calcSubmitBtn" class="calculations-submit-btn">Добавить</button>
          </div>
        </form>
        <div class="table-wrap">
          <table id="calculationsTable">
            <thead>
              <tr>
                <th>Дата</th>
                <th>Откуда</th>
                <th>Куда</th>
                <th class="th-money">Сумма</th>
                <th>Комментарий</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="calculationsMessage"></p>
      </div>
    </section>

    <section id="section-balance" class="content-section">
      <div class="card">
        <div class="table-wrap">
          <table id="balanceTable">
            <thead>
              <tr>
                <th>Участник</th>
                <th class="th-money">Сумма</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="balanceMessage"></p>
      </div>
    </section>

    <section id="section-settings" class="content-section">
      <div class="card">
        <div class="settings-rate-row">
          <label for="settings_installer_rate_per_m2">Стоимость монтажа 1м², руб</label>
          <input type="number" step="0.01" min="0" id="settings_installer_rate_per_m2" />
          <button type="button" id="settingsSaveInstallerRateBtn" class="btn-primary">Сохранить</button>
        </div>
      </div>
    </section>
  </div>

  <div id="filesModal" class="files-modal" style="display:none;">
    <div class="files-modal-content">
      <div class="files-modal-header">
        <h3 id="filesModalTitle">Файлы заказа</h3>
        <button type="button" id="closeFilesModal">✖</button>
      </div>

      <div id="filesModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/main.js?v=2"></script>
</body>
</html>
