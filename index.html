<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заявки</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <div class="user-row">
          <p id="userInfo"></p>
          <button id="logoutBtn" class="logout-icon-btn" type="button" title="Выйти">
            <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <nav class="section-nav" role="navigation">
      <button type="button" class="section-nav-btn active" data-section="all">Заказы</button>
      <button type="button" class="section-nav-btn" data-section="new">Новый</button>
      <button type="button" class="section-nav-btn" data-section="calculations">Расчеты</button>
    </nav>

    <section id="section-new" class="content-section">
      <div class="card">

      <form id="orderForm">
        <div class="grid">
          <div class="field">
            <label>Телефон</label>
            <input type="text" id="phone" />
          </div>

          <div class="field">
            <label>Клиент</label>
            <input type="text" id="client" />
          </div>

          <div class="field">
            <label>Тип клиента</label>
            <select id="client_type">
              <option value="" selected></option>
              <option value="Частник">Частник</option>
              <option value="Диллер">Диллер</option>
            </select>
          </div>

          <div class="field">
            <label>Адрес</label>
            <input type="text" id="address" />
          </div>

          <div class="field">
            <label>Статус</label>
            <select id="payment_status">
              <option value="Контакт с клиентом" selected>Контакт с клиентом</option>
              <option value="Замер назначен">Замер назначен</option>
              <option value="Замер проведен">Замер проведен</option>
              <option value="Предложение направлено">Предложение направлено</option>
              <option value="Клиент согласен">Клиент согласен</option>
              <option value="Производство">Производство</option>
              <option value="Монтаж выполнен">Монтаж выполнен</option>
              <option value="Заказ закрыт">Заказ закрыт</option>
            </select>
          </div>

          <div class="field field-order-date-hidden">
            <label>Дата заказа</label>
            <input type="datetime-local" id="order_date" />
          </div>

          <div class="field">
            <label>Номер</label>
            <input type="text" id="order_number" />
          </div>

          <div class="field">
            <label>Стоимость</label>
            <input type="number" step="0.01" id="amount" />
          </div>

          <div class="field">
            <label>Предоплата</label>
            <input type="number" step="0.01" id="prepayment" />
          </div>

          <div class="field">
            <label>Кому предоплата</label>
            <select id="prepayment_to">
              <option value="">—</option>
              <option value="Дима">Дима</option>
              <option value="Вова">Вова</option>
              <option value="Безнал">Безнал</option>
              <option value="Касса">Касса</option>
            </select>
          </div>

          <div class="field">
            <label>Остаток</label>
            <input type="number" step="0.01" id="remaining_amount" />
          </div>

          <div class="field">
            <label>Кому остаток</label>
            <select id="remaining_to">
              <option value="">—</option>
              <option value="Дима">Дима</option>
              <option value="Вова">Вова</option>
              <option value="Безнал">Безнал</option>
              <option value="Касса">Касса</option>
            </select>
          </div>

          <div class="field">
            <label>Оплачено</label>
            <select id="paid" disabled>
              <option value="нет">нет</option>
              <option value="да">да</option>
            </select>
          </div>

          <div class="field">
            <label>Площадь м²</label>
            <input type="number" step="0.01" id="area_m2" />
          </div>

          <div class="field">
            <label>Москитные сетки</label>
            <input type="number" step="1" min="0" id="mosquito_nets" />
          </div>

          <div class="field">
            <label>Кол-во конструкций</label>
            <input type="number" step="1" min="0" id="construction_count" />
          </div>

          <div class="field">
            <label>Тип доставки</label>
            <select id="delivery">
              <option value="">—</option>
              <option value="Доставка">Доставка</option>
              <option value="Самовывоз">Самовывоз</option>
            </select>
          </div>

          <div class="field">
            <label>Дата доставки/самовывоза</label>
            <input type="date" id="delivery_date" />
          </div>

          <div class="field installation-row">
            <div class="installation-checkbox-wrap">
              <label class="label-checkbox">
                <input type="checkbox" id="installation" />
                Монтаж
              </label>
            </div>
            <div class="field installation-date-wrap" id="installationDateWrap" style="display: none;">
              <label>Дата монтажа</label>
              <input type="date" id="installation_date" />
            </div>
          </div>

          <div class="field installation-row">
            <div class="installation-checkbox-wrap">
              <label class="label-checkbox">
                <input type="checkbox" id="reveals" />
                Откосы
              </label>
            </div>
            <div class="field installation-date-wrap" id="revealsDateWrap" style="display: none;">
              <label>Дата откосов</label>
              <input type="date" id="reveals_date" />
            </div>
          </div>

          <div class="field full">
            <label>Добавить комментарий</label>
            <textarea id="description"></textarea>
          </div>

          <div class="field full file-upload-group">
            <label for="attachments">Фото и документы</label>

            <div class="file-upload-box">
              <input
                type="file"
                id="attachments"
                multiple
                accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"
                hidden
              />

              <div class="upload-area">
                <button type="button" id="selectFilesBtn" class="upload-btn">
                  <svg class="upload-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                  Выбрать файлы
                </button>
                <span id="fileUploadText" class="file-upload-text">Файлы не выбраны</span>
              </div>

              <div id="selectedFiles" class="selected-files"></div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn">Сохранить заказ</button>
          <button type="button" id="cancelEditBtn" style="display: none;">Отмена</button>
        </div>
      </form>

      <p id="message"></p>
    </div>
    </section>

    <section id="section-all" class="content-section active">
      <div class="card">
      <div class="search-box">
        <input
          type="text"
          id="clientSearch"
          placeholder="Поиск по Телефон, Клиент, Адрес, Номер, Описание"
        />
      </div>

      <div id="cellTooltip" class="cell-tooltip" aria-hidden="true"></div>
      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th></th>
              <th></th>
              <th>ID</th>
              <th>Клиент</th>
              <th>Адрес</th>
              <th>Статус</th>
              <th>Оплачено</th>
              <th>Дата заказа</th>
              <th>Номер</th>
              <th>Стоимость</th>
              <th>Предоплата</th>
              <th>Остаток</th>
              <th>Тип доставки</th>
              <th>Дата доставки/самовывоза</th>
              <th>Телефон</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    </section>

    <section id="section-calculations" class="content-section">
      <div class="card">
        <form id="calculationsForm" class="calculations-form" aria-label="Добавить запись в расчеты">
          <div class="calculations-form-column">
            <div class="field">
              <label for="calcFrom">Откуда</label>
              <select id="calcFrom">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
                <option value="Костя">Костя</option>
                <option value="Безнал Костя">Безнал Костя</option>
                <option value="Клиент магазин">Клиент магазин</option>
                <option value="Безнал магазазин">Безнал магазазин</option>
                <option value="Дима магазин">Дима магазин</option>
                <option value="Вова магазин">Вова магазин</option>
                <option value="Касса магазин">Касса магазин</option>
              </select>
            </div>
            <div class="field">
              <label for="calcTo">Куда</label>
              <select id="calcTo">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Зарплата">Зарплата</option>
                <option value="Покупка">Покупка</option>
                <option value="Списание">Списание</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
                <option value="Костя">Костя</option>
                <option value="Безнал Костя">Безнал Костя</option>
                <option value="Безнал магазин">Безнал магазин</option>
                <option value="Дима магазин">Дима магазин</option>
                <option value="В магаз.">В магаз.</option>
                <option value="К магаз.">К магаз.</option>
              </select>
            </div>
            <div class="field">
              <label for="calcAmount">Сумма</label>
              <input type="number" id="calcAmount" step="0.01" placeholder="0" />
            </div>
            <div class="field">
              <label for="calcComment">Комментарий</label>
              <input type="text" id="calcComment" placeholder="Комментарий" />
            </div>
            <button type="submit" id="calcSubmitBtn" class="calculations-submit-btn">Добавить</button>
          </div>
        </form>
        <div class="table-wrap">
          <table id="calculationsTable">
            <thead>
              <tr>
                <th>Дата время</th>
                <th>Откуда</th>
                <th>Куда</th>
                <th>Сумма</th>
                <th>Комментарий</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <p id="calculationsMessage"></p>
      </div>
    </section>
  </div>

  <div id="filesModal" class="files-modal" style="display:none;">
    <div class="files-modal-content">
      <div class="files-modal-header">
        <h3 id="filesModalTitle">Файлы заказа</h3>
        <button type="button" id="closeFilesModal">✖</button>
      </div>

      <div id="filesModalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/main.js?v=2"></script>
</body>
</html>
