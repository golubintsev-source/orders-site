<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://yizwpogwabosuguakyzt.supabase.co" crossorigin>
  <!-- Ставим монитор до остальных скриптов, чтобы не потерять ранние запросы и ошибки. -->
  <script src="./js/performance-monitor.js"></script>
  <!-- Раздел «Чаты»: запрос списка уходит уже во время разбора HTML, до supabase-js и main.js. -->
  <script src="./js/chat-boot.js"></script>
  <!-- В <head>, чтобы скачивание шло параллельно разбору body: config.js требует window.supabase. -->
  <script defer src="./js/vendor/supabase.js"></script>
  <script defer src="./js/register-sw.js"></script>
  <script defer src="./js/pull-to-refresh.js"></script>
  <title>ФАБРИКА ОКОН</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ФАБРИКА ОКОН">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20260803">
  <link rel="stylesheet" href="./style.css">
  <link rel="modulepreload" href="./js/boot-route.js">
  <link rel="modulepreload" href="./js/main.js">
  <link rel="modulepreload" href="./js/config.js">
  <link rel="modulepreload" href="./js/state.js">
  <link rel="modulepreload" href="./js/auth.js">
  <link rel="modulepreload" href="./js/orders.js">
  <link rel="modulepreload" href="./js/section-nav.js">
  <link rel="modulepreload" href="./js/ui.js">
  <link rel="modulepreload" href="./js/files.js">
  <!-- cropper/leaflet CSS подгружаются лениво вместе со скриптами (см. js/lazy-cdn.js) -->
</head>
<body>
  <div id="dbUnavailableBanner" class="db-unavailable-banner" hidden role="alert" aria-live="polite">
    <span class="db-unavailable-banner__icon" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="18" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
        <ellipse cx="17" cy="21" rx="2.5" ry="3" fill="#374151"/>
        <ellipse cx="31" cy="21" rx="2.5" ry="3" fill="#374151"/>
        <path d="M16 33c3-4 13-4 16 0" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M38 17c1.5 2 1 4-1 3.5" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="39" cy="15" r="2" fill="#bfdbfe"/>
      </svg>
    </span>
    <span class="db-unavailable-banner__text" id="dbUnavailableBannerText">Нет связи с базой данных</span>
  </div>
  <div class="container">
    <div class="topbar">
      <nav class="section-nav topbar-section-nav" role="navigation">
        <div class="section-nav-dropdown-wrap section-nav-search-wrap">
          <button type="button" class="section-nav-search-btn" id="ordersSearchOpenBtn" title="Поиск по заказам" aria-label="Поиск по заказам" aria-haspopup="true" aria-expanded="false" aria-controls="ordersSearchDropdownPanel">
            <svg class="section-nav-search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="ordersSearchDropdownPanel" class="section-nav-dropdown-panel orders-search-dropdown-panel" hidden role="dialog" aria-label="Поиск по заказам">
            <input type="text" id="ordersSearchPopupInput" class="orders-search-dropdown-input" placeholder="Телефон, клиент, адрес, номер…" autocomplete="off" />
            <button type="button" id="ordersSearchFindBtn" class="orders-search-dropdown-btn orders-search-dropdown-btn-primary">Найти</button>
            <button type="button" id="ordersSearchCloseBtn" class="orders-search-dropdown-btn orders-search-dropdown-btn-secondary">Отмена</button>
          </div>
        </div>
        <div class="section-nav-dropdown-wrap">
          <button type="button" class="section-nav-current" id="sectionNavCurrentBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="sectionNavDropdownPanel">
            <span class="section-nav-current-label" id="sectionNavCurrentLabel">Заказы</span>
            <svg class="section-nav-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="section-nav-dropdown-panel" id="sectionNavDropdownPanel" role="listbox" aria-label="Разделы" hidden>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l3 3v17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M15 2v5h5"/><path d="M7 13h10"/><path d="M7 17h7"/></svg>
              <span class="section-nav-dropdown-item-text">Заказы</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="new">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              <span class="section-nav-dropdown-item-text">Новый</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="calculations">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
              <span class="section-nav-dropdown-item-text">Расчеты</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="excess">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M5 12h14"/><rect x="3" y="6" width="18" height="12" rx="2"/></svg>
              <span class="section-nav-dropdown-item-text">Излишки</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="tasks-all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <span class="section-nav-dropdown-item-text">Мои задачи</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="changes-all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v
