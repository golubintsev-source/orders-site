<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>История заказа</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="history-page">
  <div class="container">
    <header class="history-page-toolbar">
      <button type="button" id="backToOrdersBtn" class="history-back-btn">← Назад к заказам</button>
      <span id="historyPageTitle" class="history-page-title" role="status" aria-live="polite"></span>
    </header>
    <div class="card order-tasks-card">
      <form id="historyCommentForm" class="order-tasks-form-stack" aria-label="Добавить комментарий в историю">
        <div class="field order-tasks-field">
          <label for="historyComment">Новый комментарий</label>
          <div class="order-tasks-input-row order-tasks-input-row--textarea">
            <textarea
              id="historyComment"
              class="order-tasks-input order-tasks-textarea"
              rows="2"
              placeholder="Введите комментарий..."
              maxlength="2000"
            ></textarea>
            <button type="submit" class="btn-primary order-tasks-create-btn">Добавить</button>
          </div>
        </div>
      </form>
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Дата время</th>
              <th>Автор</th>
              <th>Текст</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="historyMessage" class="order-tasks-hint"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/history.js"></script>
</body>
</html>
