<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script defer src="./js/register-sw.js"></script>
  <script defer src="./js/pull-to-refresh.js"></script>
  <title>Изменения</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Оконная фабрика">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20260803">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <div class="topbar">
      <nav class="section-nav topbar-section-nav" role="navigation">
        <div class="section-nav-dropdown-wrap section-nav-search-wrap">
          <button type="button" class="section-nav-search-btn" id="ordersSearchOpenBtn" title="Поиск по заказам" aria-label="Поиск по заказам" aria-haspopup="true" aria-expanded="false" aria-controls="ordersSearchDropdownPanel">
            <svg class="section-nav-search-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M20 20l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <div id="ordersSearchDropdownPanel" class="section-nav-dropdown-panel orders-search-dropdown-panel" hidden role="dialog" aria-label="Поиск по заказам">
            <input type="text" id="ordersSearchPopupInput" class="orders-search-dropdown-input" placeholder="Телефон, клиент, адрес, номер…" autocomplete="off" />
            <button type="button" id="ordersSearchFindBtn" class="orders-search-dropdown-btn orders-search-dropdown-btn-primary">Найти</button>
            <button type="button" id="ordersSearchCloseBtn" class="orders-search-dropdown-btn orders-search-dropdown-btn-secondary">Отмена</button>
          </div>
        </div>
        <div class="section-nav-dropdown-wrap">
          <button type="button" class="section-nav-current" id="sectionNavCurrentBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="sectionNavDropdownPanel">
            <span class="section-nav-current-label" id="sectionNavCurrentLabel">Заказы</span>
            <svg class="section-nav-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="section-nav-dropdown-panel" id="sectionNavDropdownPanel" role="listbox" aria-label="Разделы" hidden>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l3 3v17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M15 2v5h5"/><path d="M7 13h10"/><path d="M7 17h7"/></svg>
              <span class="section-nav-dropdown-item-text">Заказы</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="new">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              <span class="section-nav-dropdown-item-text">Новый</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="calculations">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
              <span class="section-nav-dropdown-item-text">Расчеты</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="tasks-all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
              <span class="section-nav-dropdown-item-text">Все задачи</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="changes-all">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <span class="section-nav-dropdown-item-text">Все изменения</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="balance">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span class="section-nav-dropdown-item-text">Баланс</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="route-sheet">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-4.5-8-11a8 8 0 0 1 16 0c0 6.5-8 11-8 11z"/><circle cx="12" cy="10" r="3"/></svg>
              <span class="section-nav-dropdown-item-text">Маршрутный лист</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="orders-excel">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
              <span class="section-nav-dropdown-item-text">Заказы в Excel</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="statistics">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span class="section-nav-dropdown-item-text">Статистика</span>
            </button>
            <button type="button" role="option" class="section-nav-dropdown-item" data-section="settings">
              <svg class="section-nav-dropdown-item-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span class="section-nav-dropdown-item-text">Настройки</span>
            </button>
            <div class="section-nav-dropdown-footer">
              <div class="section-nav-dropdown-stat section-nav-dropdown-stat--admin" id="sectionNavRicherStat" role="status" aria-live="polite" hidden>
                <div class="section-nav-dropdown-stat-row">
                  <span class="section-nav-dropdown-stat-label">Мог быть богаче на</span>
                  <span class="section-nav-dropdown-stat-value" id="sectionNavRicherSum">—</span>
                </div>
              </div>
              <p class="section-nav-dropdown-motivation-text" id="sectionNavMotivationText" aria-live="polite"></p>
            </div>
          </div>
        </div>
      </nav>
      <div class="topbar-toolbar">
        <span id="topbarUserName" class="topbar-user-name" aria-label="Текущий пользователь"></span>
        <button id="logoutBtn" class="logout-icon-btn" type="button" title="Выйти">
          <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="card order-tasks-card">
      <div class="table-wrap">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Дата время</th>
              <th>Автор</th>
              <th>Текст</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="historyMessage" class="order-tasks-hint"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/history.js"></script>
</body>
</html>
