<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ФАБРИКА ОКОН">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20260803">
<script defer src="js/register-sw.js"></script>
<script defer src="js/pull-to-refresh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

html{
box-sizing:border-box;
}
*,*::before,*::after{
box-sizing:inherit;
}

body{
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
min-height:100dvh;
width:100%;
margin:0;
padding:max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
background:#f4f4f4;
}

.card{
background:white;
padding:24px;
border-radius:10px;
width:100%;
max-width:420px;
box-sizing:border-box;
}

.login-logo{
width:100%;
max-width:240px;
display:block;
margin:0 auto 16px auto;
}

input{
width:100%;
padding:10px;
margin-bottom:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:10px;
background:#007bff;
color:white;
border:none;
box-sizing:border-box;
display:block;
}

@media (max-width:480px){
body{
padding:max(0px, env(safe-area-inset-top)) max(0px, env(safe-area-inset-right)) max(0px, env(safe-area-inset-bottom)) max(0px, env(safe-area-inset-left));
align-items:stretch;
}
.card{
max-width:none;
border-radius:0;
min-height:100dvh;
}
}

</style>

</head>

<body>

<div class="card">

<img class="login-logo" src="./img/logo.png" alt="Логотип">

<input id="email" placeholder="email">

<input id="password" type="password" placeholder="password">

<button onclick="login()">Войти</button>

<p id="message"></p>

</div>

<script type="module" src="js/login-page.js"></script>

</body>
</html>
