<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="./js/register-sw.js"></script>
  <script defer src="./js/pull-to-refresh.js"></script>
  <title>Расчеты</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ФАБРИКА ОКОН">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=20260803">
  <link rel="stylesheet" href="./style.css">
  <style>
    .calculations-page .container { padding: 12px; }
    .calculations-page h1 { font-size: 18px; margin-bottom: 12px; }
    .calculations-page .back-btn { margin-bottom: 12px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #1f6feb; background: transparent; border: 1px solid #1f6feb; border-radius: 8px; cursor: pointer; }
    .calculations-page .back-btn:hover { background: rgba(31, 111, 235, 0.08); }
  </style>
</head>
<body class="calculations-page">
  <div id="dbUnavailableBanner" class="db-unavailable-banner" hidden role="alert" aria-live="polite">
    <span class="db-unavailable-banner__icon" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="18" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
        <ellipse cx="17" cy="21" rx="2.5" ry="3" fill="#374151"/>
        <ellipse cx="31" cy="21" rx="2.5" ry="3" fill="#374151"/>
        <path d="M16 33c3-4 13-4 16 0" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M38 17c1.5 2 1 4-1 3.5" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" fill="none"/>
        <circle cx="39" cy="15" r="2" fill="#bfdbfe"/>
      </svg>
    </span>
    <span class="db-unavailable-banner__text">База данных недоступна</span>
  </div>
  <div class="container">
    <h1>Расчеты</h1>
    <div class="card">
      <form id="calculationsForm" class="calculations-form" aria-label="Добавить запись в расчеты">
        <div class="calculations-form-column">
          <div class="calculations-form-row calculations-form-row--first">
            <div class="field">
              <label for="calcFrom">Откуда</label>
              <select id="calcFrom">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcTo">Куда</label>
              <select id="calcTo">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Зарплата">Зарплата</option>
                <option value="Покупка">Покупка</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcAmount">Сумма</label>
              <input type="text" id="calcAmount" inputmode="numeric" placeholder="0" title="Только целые рубли, без копеек" />
            </div>
          </div>
          <div class="calculations-form-row calculations-form-row--comment-submit">
            <div class="calculations-comment-wrap field">
              <input type="text" id="calcComment" class="calculations-comment-input" placeholder="Комментарий" aria-label="Комментарий" />
            </div>
            <button type="submit" id="calcSubmitBtn" class="calculations-submit-btn" title="Добавить" aria-label="Добавить">
              <svg class="calc-submit-icon-add" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <svg class="calc-submit-icon-save" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
          <p id="calcFormError" class="calculations-form-error" role="alert" hidden></p>
          <div class="calculations-form-block calculations-form-block--filters">
          <div class="calculations-form-row calculations-form-row--dates" role="group" aria-label="Период отображения">
            <div class="field calculations-date-field">
              <label for="calcDateFrom">с</label>
              <input type="date" id="calcDateFrom" autocomplete="off" />
            </div>
            <div class="field calculations-date-field">
              <label for="calcDateTo">по</label>
              <input type="date" id="calcDateTo" autocomplete="off" />
            </div>
            <button type="button" id="calcExportExcelBtn" class="calculations-export-excel-btn" title="Выгрузить в Excel" aria-label="Выгрузить в Excel">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
            </button>
          </div>
          <div class="calculations-form-row calculations-form-row--amounts" role="group" aria-label="Диапазон сумм">
            <div class="field calculations-amount-field">
              <label for="calcAmountFrom">от</label>
              <input type="text" id="calcAmountFrom" inputmode="numeric" autocomplete="off" title="Только целые рубли, без копеек" aria-label="Сумма от" />
            </div>
            <div class="field calculations-amount-field">
              <label for="calcAmountTo">до</label>
              <input type="text" id="calcAmountTo" inputmode="numeric" autocomplete="off" title="Только целые рубли, без копеек" aria-label="Сумма до" />
            </div>
          </div>
          <div class="calculations-form-row calculations-form-row--submit-search">
            <div class="calculations-search-wrap">
              <input type="search" id="calcSearchInput" class="calculations-search-input" placeholder="Что искать" autocomplete="off" enterkeyhint="search" aria-label="Поиск по таблице" />
              <button type="button" id="calcSearchBtn" class="calculations-search-btn" aria-label="Применить период, диапазон сумм и поиск по таблице">Показать</button>
            </div>
          </div>
          </div>
        </div>
      </form>
      <div class="table-wrap">
        <table id="calculationsTable">
          <thead>
            <tr>
              <th>Время</th>
              <th>Автор</th>
              <th>От</th>
              <th>К.</th>
              <th class="th-money">Доход</th>
              <th class="th-money">Расход</th>
              <th>Комментарий</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="calculations-saldo-wrap table-wrap">
        <table id="calculationsSaldoTable" aria-label="Сальдо по показанным записям">
          <thead>
            <tr>
              <th scope="col"></th>
              <th scope="col">Вова</th>
              <th scope="col">Дима</th>
              <th scope="col">Касса</th>
              <th scope="col">Безнал</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="calculationsMessage"></p>
    </div>
  </div>
  <script src="./js/vendor/supabase.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./js/calculations.js"></script>
</body>
</html>
