<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./js/performance-monitor.js"></script>
  <script defer src="./js/register-sw.js"></script>
  <script defer src="./js/pull-to-refresh.js"></script>
  <title>Расчеты</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ФАБРИКА ОКОН">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=installer-20261101">
  <link rel="stylesheet" href="./style.css?v=calc-edit-20261112">
  <style>
    .calculations-page .container { padding: 12px; }
    .calculations-page h1 { font-size: 18px; margin-bottom: 12px; }
    .calculations-page .back-btn { margin-bottom: 12px; padding: 8px 16px; font-size: 13px; font-weight: 600; color: #1f6feb; background: transparent; border: 1px solid #1f6feb; border-radius: 8px; cursor: pointer; }
    .calculations-page .back-btn:hover { background: rgba(31, 111, 235, 0.08); }
  </style>
</head>
<body class="calculations-page">
  <div class="container">
    <h1>Расчеты</h1>
    <div class="card">
      <form id="calculationsForm" class="calculations-form" aria-label="Добавить запись в расчеты">
        <div class="calculations-form-column">
          <div class="calculations-form-row calculations-form-row--first">
            <div class="field">
              <label for="calcFrom">Откуда</label>
              <select id="calcFrom">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcTo">Куда</label>
              <select id="calcTo">
                <option value="">—</option>
                <option value="Вова">Вова</option>
                <option value="Дима">Дима</option>
                <option value="Касса">Касса</option>
                <option value="Покупка">Покупка</option>
                <option value="Безнал">Безнал</option>
                <option value="Другое">Другое</option>
              </select>
            </div>
            <div class="field">
              <label for="calcAmount">Сумма</label>
              <input type="text" id="calcAmount" class="calculations-amount-input" inputmode="numeric" placeholder="0" title="Только целые рубли, без копеек" />
            </div>
          </div>
          <div class="calculations-form-row calculations-form-row--comment-submit">
            <div class="calculations-comment-wrap field">
              <textarea id="calcComment" rows="1" class="calculations-comment-input" placeholder="Комментарий" aria-label="Комментарий"></textarea>
            </div>
            <button type="submit" id="calcSubmitBtn" class="calculations-submit-btn" title="Добавить" aria-label="Добавить">
              <svg class="calc-submit-icon-add" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
          <p id="calcFormError" class="calculations-form-error" role="alert" hidden></p>
        </div>
      </form>
      <div class="table-wrap">
        <table id="calculationsTable">
          <thead>
            <tr>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="time" aria-haspopup="dialog" aria-expanded="false"><span>Время</span><small class="calc-filter-heading-value"></small></button></th>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="order" aria-haspopup="dialog" aria-expanded="false"><span>Заказ</span><small class="calc-filter-heading-value"></small></button></th>
              <th class="th-money"><button type="button" class="calc-filter-heading-btn" data-calc-filter="income" aria-haspopup="dialog" aria-expanded="false"><span>Доход</span><small class="calc-filter-heading-value"></small></button></th>
              <th class="th-money"><button type="button" class="calc-filter-heading-btn" data-calc-filter="expense" aria-haspopup="dialog" aria-expanded="false"><span>Расход</span><small class="calc-filter-heading-value"></small></button></th>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="comment" aria-haspopup="dialog" aria-expanded="false"><span>Комментарий</span><small class="calc-filter-heading-value"></small></button></th>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="from" aria-haspopup="dialog" aria-expanded="false"><span>Откуда</span><small class="calc-filter-heading-value"></small></button></th>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="to" aria-haspopup="dialog" aria-expanded="false"><span>Куда</span><small class="calc-filter-heading-value"></small></button></th>
              <th><button type="button" class="calc-filter-heading-btn" data-calc-filter="author" aria-haspopup="dialog" aria-expanded="false"><span>Автор</span><small class="calc-filter-heading-value"></small></button></th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="calculations-export-row">
        <button type="button" id="calcExportExcelBtn" class="calculations-export-excel-btn">Выгрузить в Excel</button>
      </div>
      <div class="calculations-saldo-wrap table-wrap">
        <table id="calculationsSaldoTable" aria-label="Сальдо по показанным записям">
          <thead>
            <tr>
              <th scope="col"></th>
              <th scope="col">Вова</th>
              <th scope="col">Дима</th>
              <th scope="col">Касса</th>
              <th scope="col">Безнал</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="calculationsMessage"></p>
    </div>
  </div>
  <script src="./js/vendor/supabase.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin="anonymous"></script>
  <script type="module" src="./js/calculations-page.js"></script>
</body>
</html>
